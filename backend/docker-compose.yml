services:
  # NOTE: PostgreSQL and MinIO are now provided by Supabase.
  # Only ClamAV remains for local antivirus scanning of evidence.
  clamav:
    image: clamav/clamav:stable
    container_name: investigation-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamavdb:/var/lib/clamav

volumes:
  clamavdb:
