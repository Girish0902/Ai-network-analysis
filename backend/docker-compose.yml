services:
  db:
    image: postgres:16
    container_name: investigation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: investigation
      POSTGRES_PASSWORD: investigation
      POSTGRES_DB: investigation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigation -d investigation"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: investigation-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    container_name: investigation-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamavdb:/var/lib/clamav

volumes:
  pgdata:
  miniodata:
  clamavdb: